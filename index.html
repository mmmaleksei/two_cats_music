<script>
'use strict';
/* =====================================================================
   Settings
   ===================================================================== */
const ST = Object.assign({
  vol: 0.75, bpm: 74, vinyl: 0.5, purr: 0.6, rain: false, storm: false, snow: false, fog: false, sky: 'auto', season: 'auto',
  // how much the room moves with the beat; starts at zero for people who ask for reduced motion
  beat: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 0.7,
  lamp: true, candle: true,
  layers: { keys: true, bass: true, drums: true, melody: true },
  licks: true
}, (() => { try { return JSON.parse(localStorage.getItem('lofisy') || '{}'); } catch (e) { return {}; } })());
function save() { try { localStorage.setItem('lofisy', JSON.stringify(ST)); } catch (e) {} }

/* =====================================================================
   Pixel helpers
   ===================================================================== */
const W = 384, H = 216;
const hex = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const pack = (c, a = 255) => ((a << 24) | (c[2] << 16) | (c[1] << 8) | c[0]) >>> 0;
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);

class Buf {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.cv = document.createElement('canvas'); this.cv.width = w; this.cv.height = h;
    this.cx = this.cv.getContext('2d');
    this.img = this.cx.createImageData(w, h);
    this.d = new Uint32Array(this.img.data.buffer);
  }
  set(x, y, c) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[y * this.w + x] = c; }
  flush() { this.cx.putImageData(this.img, 0, 0); return this.cv; }
}

/* =====================================================================
   AUDIO ENGINE
   ===================================================================== */
let AC = null, playing = false, FX = {};
let comp, master, analyser, lofiIn, mlp, duck, verbIn, dlyIn, dly, keysIn, bassIn, drumIn, melIn, lickIn, snVerb, vinylG, rainG, noiseBuf;
const busG = {};
/* ---------- beat sync ----------
   Voices push { t, k, v } into `vq` when they are scheduled; update() releases each event at the moment
   it is heard and folds it into BEAT. Anything drawn reads BEAT, so the art can change without touching audio. */
const vq = [];
const BEAT = {
  kick: 0, snare: 0, chord: 0,   // decaying hit levels, 0..1
  glow: 0,                       // smoothed kick + chord, drives the lamp
  barT: 0, barDur: 0, bars: 0,   // current bar: start time, length, running count
  pos: 0,                        // position in bars, continuous
  rate: 1, stop: null,           // tape speed, 1 -> 0 during a tape stop
  spec: new Float32Array(6)      // spectrum bands, low to high, 0..1
};
const BEAT_LAYER = { kick: 'drums', snare: 'drums', hat: 'drums', chord: 'keys' };
const SPEC_EDGE = [0, 2, 4, 8, 16, 32, 80], specPk = new Float32Array(6);   // analyser bins per band, recent peak per band
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const O = (type, f) => { const o = AC.createOscillator(); o.type = type; o.frequency.value = f; return o; };
const G = v => { const g = AC.createGain(); g.gain.value = v; return g; };
const BQ = (type, f, q = 0.7) => { const b = AC.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
function env(p, t, att, peak, sus, dtc, end, rtc) {
  p.setValueAtTime(0, t); p.linearRampToValueAtTime(peak, t + att);
  p.setTargetAtTime(sus, t + att, dtc); p.setTargetAtTime(0, Math.max(end, t + att + 0.002), rtc);
}
function satCurve(k) { const n = 2048, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; }
function loopify(d, F) { const len = d.length; for (let i = 0; i < F; i++) { const a = i / F; d[i] = d[i] * a + d[len - F + i] * (1 - a); } }

function initAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const sr = AC.sampleRate;
  master = G(ST.vol);
  comp = AC.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.knee.value = 12; comp.attack.value = 0.006; comp.release.value = 0.2;
  // the meter listens to the music bus before the volume knob, so it ignores rain, vinyl and the cats
  analyser = AC.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.5;
  analyser.minDecibels = -80; analyser.maxDecibels = -10;
  comp.connect(master); master.connect(AC.destination); comp.connect(analyser);

  // lofi bus: tape wow/flutter -> saturation -> lowpass
  lofiIn = G(1);
  const wow = AC.createDelay(0.1); wow.delayTime.value = 0.014;
  const l1 = O('sine', 0.37), l1g = G(0.0017); l1.connect(l1g); l1g.connect(wow.delayTime); l1.start();
  const l2 = O('sine', 5.6), l2g = G(0.00009); l2.connect(l2g); l2g.connect(wow.delayTime); l2.start();
  const satIn = G(1), satOut = G(1);
  const sat = AC.createWaveShaper(); sat.curve = satCurve(1.5); sat.oversample = '2x';
  // bit-depth reduction blended under the dry signal
  const crush = AC.createWaveShaper(), crushG = G(0), dryG = G(1);
  { const n = 4096, c = new Float32Array(n), steps = 2 ** 7; for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.round(x * steps) / steps; } crush.curve = c; }
  mlp = BQ('lowpass', 6000, 0.4);
  const hp = BQ('highpass', 35), shelf = BQ('lowshelf', 180); shelf.gain.value = 0;
  const tapeDly = AC.createDelay(2), tapeG = G(1); tapeDly.delayTime.value = 0;
  lofiIn.connect(tapeDly); tapeDly.connect(tapeG); tapeG.connect(wow); wow.connect(satIn); satIn.connect(sat); sat.connect(satOut);
  satOut.connect(dryG); dryG.connect(mlp); satOut.connect(crush); crush.connect(crushG); crushG.connect(mlp);
  mlp.connect(hp); hp.connect(shelf); shelf.connect(comp);

  // reverb: a small room and a large hall, mixed per track
  const impulse = (sec, decay) => {
    const len = Math.floor(sr * sec), b = AC.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); let z = 0; const pre = Math.floor(sr * 0.018);
      for (let i = pre; i < len; i++) { const t = i / len; z += ((Math.random() * 2 - 1) * Math.pow(1 - t, decay) - z) * (0.85 - 0.6 * t); d[i] = z; } }
    return b;
  };
  const room = AC.createConvolver(), hall = AC.createConvolver();
  room.buffer = impulse(1.3, 3); hall.buffer = impulse(3.4, 2.2);
  const roomG = G(0.5), hallG = G(0.5);
  verbIn = G(1); const verbOut = G(0.55);
  verbIn.connect(room); verbIn.connect(hall); room.connect(roomG); hall.connect(hallG); roomG.connect(verbOut); hallG.connect(verbOut); verbOut.connect(lofiIn);
  FX = { l1g, l2g, satIn, satOut, crushG, dryG, roomG, hallG, verbOut, tapeDly, tapeG };

  // dotted-eighth delay
  dly = AC.createDelay(2); dly.delayTime.value = 60 / ST.bpm * 0.75;
  const fb = G(0.36), dlp = BQ('lowpass', 2200); dlyIn = G(1);
  dlyIn.connect(dly); dly.connect(dlp); dlp.connect(fb); fb.connect(dly);
  const dOut = G(0.42); dlp.connect(dOut); dOut.connect(lofiIn);

  // sidechain duck (keys + bass)
  duck = G(1); duck.connect(lofiIn);

  // keys: warm LP + tremolo autopan
  keysIn = G(1);
  const klp = BQ('lowpass', 2700, 0.5), kpan = AC.createStereoPanner(); FX.klp = klp;
  const trem = O('sine', 3.1), tremG = G(0.28); trem.connect(tremG); tremG.connect(kpan.pan); trem.start();
  busG.keys = G(ST.layers.keys ? 1 : 0);
  keysIn.connect(klp); klp.connect(kpan); kpan.connect(busG.keys); busG.keys.connect(duck);
  const kv = G(0.32); busG.keys.connect(kv); kv.connect(verbIn);

  bassIn = G(1); busG.bass = G(ST.layers.bass ? 1 : 0); const bhp = BQ('highpass', 60, 0.6); bassIn.connect(bhp); bhp.connect(busG.bass); busG.bass.connect(duck);

  drumIn = G(1); busG.drums = G(ST.layers.drums ? 1 : 0); drumIn.connect(busG.drums); busG.drums.connect(lofiIn);
  snVerb = G(0.11); snVerb.connect(busG.drums.gain ? verbIn : verbIn);

  melIn = G(1); busG.melody = G(ST.layers.melody ? 1 : 0); melIn.connect(busG.melody); busG.melody.connect(lofiIn);
  lickIn = G(ST.licks ? 1 : 0); lickIn.connect(melIn);
  const md = G(0.32), mv = G(0.4); busG.melody.connect(md); md.connect(dlyIn); busG.melody.connect(mv); mv.connect(verbIn);

  // noise source
  noiseBuf = AC.createBuffer(1, sr * 2, sr);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

  // vinyl crackle + hiss
  { const len = sr * 6, b = AC.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let z = 0;
      for (let i = 0; i < len; i++) { z += (Math.random() * 2 - 1 - z) * 0.25; d[i] = z * 0.03; }
      for (let k = 0; k < 6 * 13; k++) {
        const pos = Math.floor(Math.random() * (len - 20)), amp = Math.pow(Math.random(), 3) * 0.5 + 0.03, L = 2 + Math.floor(Math.random() * 9), sg = Math.random() < 0.5 ? -1 : 1;
        for (let j = 0; j < L; j++) d[pos + j] += sg * amp * (1 - j / L) * (j % 2 ? -0.6 : 1);
      }
    }
    const src = AC.createBufferSource(); src.buffer = b; src.loop = true;
    const vhp = BQ('highpass', 280), vlp = BQ('lowpass', 7500);
    vinylG = G(ST.vinyl * 0.7);
    src.connect(vhp); vhp.connect(vlp); vlp.connect(vinylG); vinylG.connect(master); src.start(); }

  // rain ambience
  { const len = Math.floor(sr * 7.3), F = Math.floor(sr * 0.3), b = AC.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = (last * 3.2 + w * 0.09) * 0.5; }
      for (let k = 0; k < 7.3 * 55; k++) {
        const pos = Math.floor(Math.random() * (len - 400)), amp = Math.random() * Math.random() * 0.22, f = 2200 + Math.random() * 3800, L = 60 + Math.random() * 220;
        for (let j = 0; j < L; j++) d[pos + j] += amp * Math.sin(j * 2 * Math.PI * f / sr) * Math.exp(-j / (L / 4));
      }
      loopify(d, F);
    }
    const src = AC.createBufferSource(); src.buffer = b; src.loop = true; src.loopEnd = (len - F) / sr;
    const rhp = BQ('highpass', 220), rlp = BQ('lowpass', 4200);
    rainG = G(ST.rain ? 0.5 : ST.storm ? 0.75 : 0);
    src.connect(rhp); rhp.connect(rlp); rlp.connect(rainG); rainG.connect(master); src.start(); }
}

/* ---------- cat purr ----------
   Warm noise gated by a 24-30 Hz pulse train (the "rattle"), shaped into exhale/inhale breaths.
   Goes straight to the master so the music compressor and tape effects don't touch it. */
let purrBus = null;
function catBus() { if (!purrBus) { purrBus = G(ST.purr); purrBus.connect(master); } return purrBus; }
const PURR_VOICE = {
  sph: { rateE: 24, rateI: 27, lp: 520, pan: 0.1 },
  devon: { rateE: 27, rateI: 30, lp: 760, pan: -0.25 }
};
const purrs = {};
function purrNodes(id) {
  if (purrs[id]) return purrs[id];
  catBus();
  const V = PURR_VOICE[id];
  const n = AC.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
  const lp = BQ('lowpass', V.lp, 0.8), res = BQ('peaking', 280, 2); res.gain.value = 5;
  const am = G(0), breath = G(0), pan = AC.createStereoPanner(); pan.pan.value = V.pan;
  // pulse train: a sine pushed through a curve that keeps only sharp positive peaks (0..1)
  const osc = O('sine', V.rateE), shp = AC.createWaveShaper();
  { const N = 1024, c = new Float32Array(N); for (let i = 0; i < N; i++) { const x = i / (N - 1) * 2 - 1; c[i] = Math.pow(Math.max(0, x), 3); } shp.curve = c; }
  const wob = O('sine', 0.7), wobG = G(1.2); wob.connect(wobG); wobG.connect(osc.frequency);
  osc.connect(shp); shp.connect(am.gain);
  // a little of the pulse itself as low body
  const body = BQ('lowpass', 160, 0.7), bhp = BQ('highpass', 40, 0.7), bodyG = G(0.35);
  shp.connect(body); body.connect(bhp); bhp.connect(bodyG); bodyG.connect(breath);
  n.connect(lp); lp.connect(res); res.connect(am); am.connect(breath); breath.connect(pan); pan.connect(purrBus);
  n.start(); osc.start(); wob.start();
  return (purrs[id] = { V, osc, breath, active: false, next: 0 });
}
function purrStart(id) { if (!AC) return; const P = purrNodes(id); if (!P.active) { P.active = true; P.next = Math.max(P.next, AC.currentTime + 0.05); } }
function purrStop(id) { if (purrs[id]) purrs[id].active = false; }
function purrHalt(id) {

  if (fl > 0.01 && flashCv) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.55 * fl; g.drawImage(flashCv, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; }
  // dust motes in lamp light
  if (ST.lamp) for (const m of motes) px(m.x, m.y, '#ffe0a8', 0.25 + 0.25 * Math.sin(time * 1.3 + m.p));
  // candle flame: the tip leans and stretches, a little taller and brighter just after it is lit
  if (ST.candle) { const fl = Math.sin(time * 13) + Math.sin(time * 7.3 + 1), jx = fl > 1.2 ? 1 : fl < -1.2 ? -1 : 0;
    rectA(337, 73, 11, 12, '#ffb84a', 0.06 + 0.03 * Math.sin(time * 9) + 0.2 * flare);
    if (jx) { px(342, 76, '#8a4a52', 0.7); px(342 + jx, 76, '#f6a83a', 0.9); }
    if (fl > 0 || flare > 0) px(342 + jx, 75, '#f6a83a', 0.5 + 0.5 * flare);
    if (flare > 0.4) px(342, 74, '#f6a83a', flare); }
  // mug steam, and smoke from a candle that was just blown out (same particles, their own colour)
  for (const s of steam) px(s.x + Math.sin(s.a * 2.2 + s.p) * 1.4, s.y, s.c || '#e8d8c8', (s.c ? 0.6 : 0.32) * Math.sin(Math.PI * s.a / 3.4));
  g.globalAlpha = 1;
  // while the room fades after a lamp switch, the reels and cats fade over from the old light to the new one
  const light = lightNow(), lights = roomFade < 1 && lightWas !== light ? [[lightWas, 1], [light, roomFade]] : [[light, 1]];
  // tape deck: reels, and the meters while music plays
  if (reelFrames.length) { const k = ((Math.round(reelA / (2 * Math.PI) * REEL_N) % REEL_N) + REEL_N) % REEL_N;
    for (const [L, a] of lights) { const f = reelsIn(L); g.globalAlpha = a; REELS.forEach(([cx, cy], r) => g.drawImage(f[r][k], cx - REEL_R, cy - REEL_R)); }
    g.globalAlpha = 1; }
  if (playing) for (let r = 0; r < 2; r++) {
    const n = Math.round((BEAT.spec[r * 3] + BEAT.spec[r * 3 + 1] + BEAT.spec[r * 3 + 2]) / 3 * 6);
    for (let i = 0; i < 6; i++) px(LEDS.x + 2 * i, LEDS.rows[r], i < n ? LEDS.on[i] : LEDS.off[i]);
  }
  // cats: bodies take the in-breath frame at the top of a breath; the Devon's tail sways from the sill
  const D = cats.devon, S = cats.sph;
  if (SPR['devon-body']) for (const [L, a] of lights) {
    g.globalAlpha = a;
    for (const [c, cat] of [[D, 'devon'], [S, 'sph']]) { const n = cat + '-body' + (c.br > 0.5 ? '-in' : ''); g.drawImage(lit(n, L), SPR[n].x, SPR[n].y); }
    drawTail(swayPh, L);
  }
  g.globalAlpha = 1;

  // present; on a narrow screen the wall runs on above the picture and the desk below it, fading into the dark
  sc.fillStyle = '#0d0912'; sc.fillRect(0, 0, screen.width, screen.height);
  sc.imageSmoothingEnabled = false;
  const yTop = Math.round(view.oy), yBot = Math.round(view.oy + H * view.s);
  if (yTop > 0) {
    sc.drawImage(low, 0, 0, W, 1, view.ox, 0, W * view.s, yTop);
    sc.drawImage(low, 0, H - 1, W, 1, view.ox, yBot, W * view.s, screen.height - yBot);
    for (const [y0, y1] of [[yTop, 0], [yBot, screen.height]]) {
      const gr = sc.createLinearGradient(0, y0, 0, y1);
      gr.addColorStop(0, 'rgba(13,9,18,0)'); gr.addColorStop(1, 'rgba(13,9,18,0.9)');
      sc.fillStyle = gr; sc.fillRect(0, Math.min(y0, y1), screen.width, Math.abs(y1 - y0));
    }
  }
  sc.drawImage(low, 0, 0, W, H, view.ox, yTop, W * view.s, yBot - yTop);
  // heads are drawn at screen resolution so a nod or a breath can move them by part of a pixel. Eyes shut for a blink,
  // a doze or a pet; the Sphynx's lids droop when it gets sleepy, and an ear flicks now and then on the backbeat.
  if (!SPR['devon-head']) return;
  const head = (spr, x, y) => sc.drawImage(spr, Math.round(view.ox + x * view.s), Math.round(view.oy + y * view.s), Math.round(spr.width * view.s), Math.round(spr.height * view.s));
  const nodOff = D.nod > 0 ? 0.5 * Math.sin(Math.PI * (1 - D.nod)) : 0, dShut = D.mouth <= 0 && (D.blink > 0 || D.doze > 0);
  const dh = SPR['devon-head'], sh = SPR['sph-head'];
  const sEyes = S.mouth > 0 ? 'open' : S.blink > 0 || S.doze > 0 || (S.sleepy > 0 && S.sleepy < 1.2) ? 'closed' : S.sleepy > 0 ? 'half' : 'open';
  for (const [L, a] of lights) {
    sc.globalAlpha = a;
    head(dShut ? catHead('devon', 'closed', false, '', 0, 0, L) : catHead('devon', 'open', D.mouth > 0, '', D.lx, D.ly, L), dh.x, dh.y + nodOff - BREATH * D.br);
    head(catHead('sph', sEyes, S.mouth > 0, S.ear > 0 ? S.earSide : '', sEyes === 'open' ? S.lx : 0, sEyes === 'open' ? S.ly : 0, L), sh.x, sh.y + (S.tap > 0.5 ? 1 : 0) - BREATH * S.br);
  }
  sc.globalAlpha = 1;
}

let lastT = performance.now(), lastSkyCheck = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  update(dt); draw();
  if (now - lastSkyCheck > 60000) { lastSkyCheck = now; setSky(viewFor()); }
  requestAnimationFrame(frame);
}

/* =====================================================================
   BOOT
   ===================================================================== */
resize(); syncUI(); poke();
fetch('scene.json', { cache: 'no-cache' }).then(r => r.json()).then(meta => loadArt(meta).then(() => meta)).then(meta => {
  sky = ART.skies[viewFor()] ? viewFor() : Object.keys(ART.skies)[0];
  readArt(); buildCats(meta); buildReels();
  roomCv = buildRoom(); glowCv = buildGlow(); flashCv = buildFlashLight();
  { const o = Object.values(ART.skies)[0].img; fogCv = buildFog(o.width, o.height); }
  spawnRain(); spawnSnow();
  lastT = performance.now();
  requestAnimationFrame(frame);
}).catch(e => console.error('scene failed to start (are scene.json, its skies, room.png and cats.png there?)', e));
</script>
</body>
