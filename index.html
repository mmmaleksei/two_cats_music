<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LofiSy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(17,12,24,.78);
  --panel-edge: rgba(243,226,196,.14);
  --ink:#f3e2c4;
  --dim:#a8917a;
  --accent:#f2a94e;
  --accent-ink:#1a1018;
  --shadow: rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0912;overflow:hidden}
body{font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;color:var(--ink);-webkit-font-smoothing:none}
#screen{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(8,4,12,.55) 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#bigplay{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:12px;padding:12px 22px 12px 18px;font-size:30px;letter-spacing:1px;
  background:var(--panel);border:2px solid var(--panel-edge);box-shadow:6px 6px 0 var(--shadow);
  transition:opacity .6s, transform .6s}
#bigplay svg{width:26px;height:26px}
#bigplay:hover{color:var(--accent)}
#bigplay.gone{opacity:0;pointer-events:none;transform:translate(-50%,-46%)}

#hud{position:fixed;left:16px;bottom:16px;max-width:calc(100vw - 32px);
  background:var(--panel);border:2px solid var(--panel-edge);box-shadow:5px 5px 0 var(--shadow);
  padding:10px 12px 10px 14px;transition:opacity .8s}
body.idle #hud{opacity:0}
body.idle{cursor:none}
.np .lbl{font-size:15px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
#title{font-size:28px;line-height:1;margin:2px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
#meta{font-size:16px;color:var(--dim);max-width:320px}
.row{display:flex;align-items:center;gap:6px;margin-top:8px}
.ic{width:32px;height:32px;display:grid;place-items:center;border:2px solid transparent}
.ic svg{width:18px;height:18px;shape-rendering:crispEdges}
.ic:hover{color:var(--accent)}
.ic[aria-pressed="true"]{color:var(--accent);border-color:var(--panel-edge)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:96px;height:24px;margin:0 4px}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--panel-edge)}
input[type=range]::-moz-range-track{height:4px;background:var(--panel-edge)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:14px;margin-top:-5px;background:var(--ink);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:10px;height:14px;background:var(--ink);border:0;border-radius:0}
input[type=range]:hover::-webkit-slider-thumb{background:var(--accent)}

#panel{margin-top:10px;padding-top:8px;border-top:2px solid var(--panel-edge);font-size:19px;display:grid;gap:7px}
#panel[hidden]{display:none}
#panel .f{display:flex;align-items:center;gap:8px;justify-content:space-between}
#panel .f > span:first-child{color:var(--dim);min-width:58px}
#panel .val{min-width:30px;text-align:right}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:1px 7px;border:2px solid var(--panel-edge);font-size:17px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.seg button:hover{border-color:var(--accent)}
.keys{font-size:15px;color:var(--dim)}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="vignette"></div>

<button id="bigplay" aria-label="Play">
  <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2h2v1h1v1h1v1h1v1h1v1h1v2h-1v1h-1v1H9v1H8v1H7v1H6v1H4z"/></svg>
  <span>play</span>
</button>

<div id="hud">
  <div class="np">
    <div class="lbl">now playing</div>
    <div id="title">lamplight room</div>
    <div id="meta">live synthesized lofi</div>
  </div>
  <div class="row">
    <button id="play" class="ic" title="Play / pause (Space)" aria-label="Play"></button>
    <button id="next" class="ic" title="Next track (N)" aria-label="Next track">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h2v1h1v1h1v1h1v1h1v2H7v1H6v1H5v1H4v1H2zM9 3h2v1h1v1h1v1h1v1h0v2h-1v1h-1v1h-1v1h-1v1H9z"/></svg>
    </button>
    <input id="vol" type="range" min="0" max="1" step="0.01" aria-label="Volume" title="Volume">
    <button id="rain" class="ic" title="Rain (R)" aria-label="Rain" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 2h4v1h1v1h2v1h1v3h-1v1H3V8H2V6h1V5h1V4h1V3h1zM4 11h1v1H4zM3 13h1v1H3zM8 11h1v1H8zM7 13h1v1H7zM12 11h1v1h-1zM11 13h1v1h-1z"/></svg>
    </button>
    <button id="gear" class="ic" title="Settings" aria-label="Settings" aria-expanded="false">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v1H2zM4 2h2v3H4zM2 8h12v1H2zM10 7h2v3h-2zM2 12h12v1H2zM6 11h2v3H6z"/></svg>
    </button>
    <button id="fs" class="ic" title="Fullscreen (F)" aria-label="Fullscreen">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h4v2H4v2H2zM10 2h4v4h-2V4h-2zM2 10h2v2h2v2H2zM12 10h2v4h-4v-2h2z"/></svg>
    </button>
  </div>
  <div id="panel" hidden>
    <div class="f"><span>base tempo</span><input id="bpm" type="range" min="62" max="92" step="1"><span class="val" id="bpmv"></span></div>
    <div class="f"><span>vinyl</span><input id="vinyl" type="range" min="0" max="1" step="0.01"><span class="val"></span></div>
    <div class="f"><span>cats</span><input id="purr" type="range" min="0" max="1" step="0.01"><span class="val"></span></div>
    <div class="f"><span>groove</span><input id="beat" type="range" min="0" max="1" step="0.01" title="How much the room moves with the beat"><span class="val"></span></div>
    <div class="f"><span>sky</span><div class="seg" id="sky">
      <button data-v="auto">auto</button><button data-v="sunset">sunset</button><button data-v="dusk">dusk</button><button data-v="night">night</button>
    </div></div>
    <div class="f"><span>layers</span><div class="seg" id="layers">
      <button data-v="keys">keys</button><button data-v="bass">bass</button><button data-v="drums">drums</button><button data-v="melody">melody</button>
    </div></div>
    <div class="keys">space play · n next · r rain · f fullscreen · l lamp · c candle<br>click a cat to say hi · hold to pet<br>the lamp, candle, mug, window and boombox answer a click</div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   Settings
   ===================================================================== */
const ST = Object.assign({
  vol: 0.75, bpm: 74, vinyl: 0.5, purr: 0.6, rain: false, sky: 'auto',
  // how much the room moves with the beat; starts at zero for people who ask for reduced motion
  beat: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 0.7,
  lamp: true, candle: true,
  layers: { keys: true, bass: true, drums: true, melody: true }
}, (() => { try { return JSON.parse(localStorage.getItem('lofisy') || '{}'); } catch (e) { return {}; } })());
function save() { try { localStorage.setItem('lofisy', JSON.stringify(ST)); } catch (e) {} }

/* =====================================================================
   Pixel helpers
   ===================================================================== */
const W = 320, H = 180, HZ = 80;
const hex = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const pack = (c, a = 255) => ((a << 24) | (c[2] << 16) | (c[1] << 8) | c[0]) >>> 0;
const mix = (a, b, t) => [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * t));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
function dpick(ramp, v, x, y) {
  const n = ramp.length - 1;
  if (v <= 0) return ramp[0];
  if (v >= n) return ramp[n];
  const i = Math.floor(v);
  return (v - i) > BAYER[(y & 3) * 4 + (x & 3)] ? ramp[i + 1] : ramp[i];
}
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const h2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
const packRamp = r => r.map(c => pack(typeof c === 'string' ? hex(c) : c));

class Buf {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.cv = document.createElement('canvas'); this.cv.width = w; this.cv.height = h;
    this.cx = this.cv.getContext('2d');
    this.img = this.cx.createImageData(w, h);
    this.d = new Uint32Array(this.img.data.buffer);
  }
  set(x, y, c) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[y * this.w + x] = c; }
  flush() { this.cx.putImageData(this.img, 0, 0); return this.cv; }
}

/* Shape: draw with materials + light levels, then auto-shade + outline */
class Shape {
  constructor(w, h) { this.w = w; this.h = h; this.m = new Int8Array(w * h).fill(-1); this.l = new Float32Array(w * h); this.fx = []; }
  put(x, y, m, l) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; const i = y * this.w + x; this.m[i] = m; this.l[i] = l; }
  has(x, y) { return !(x < 0 || y < 0 || x >= this.w || y >= this.h) && this.m[y * this.w + x] >= 0; }
  adj(x, y, d) { if (this.has(x, y)) this.l[y * this.w + x] += d; }
  rect(x, y, w, h, m, l) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.put(i, j, m, typeof l === 'function' ? l(i, j) : l); }
  ell(cx, cy, rx, ry, m, l, rot = 0) {
    const c = Math.cos(rot), s = Math.sin(rot), R = Math.ceil(Math.max(rx, ry)) + 1;
    for (let y = Math.floor(cy - R); y <= cy + R; y++) for (let x = Math.floor(cx - R); x <= cx + R; x++) {
      const dx = x - cx, dy = y - cy, u = (dx * c + dy * s) / rx, v = (-dx * s + dy * c) / ry;
      if (u * u + v * v <= 1) this.put(x, y, m, typeof l === 'function' ? l(x, y) : l);
    }
  }
  poly(pts, m, l) {
    let y0 = Infinity, y1 = -Infinity; for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
      const yc = y + 0.5, xs = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
      xs.sort((p, q) => p - q);
      for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.round(xs[k]); x < Math.round(xs[k + 1]); x++) this.put(x, y, m, typeof l === 'function' ? l(x, y) : l);
    }
  }
  line(x0, y0, x1, y1, m, l, th = 1) {
    const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))) * 2 + 1;
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
      if (th <= 1) this.put(x, y, m, l); else this.rect(Math.round(x - (th - 1) / 2), Math.round(y - (th - 1) / 2), th, th, m, l);
    }
  }
  texture(fn) { for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) { const i = y * this.w + x; if (this.m[i] >= 0) this.l[i] += fn(x, y, this.m[i]); } }
  dot(x, y, c) { this.fx.push([x, y, c]); }
  render(ramps, o = {}) {
    const light = o.light ?? -1, off = o.off ?? 0, rim = o.rim ?? 1, sh = o.shadow ?? 0.9;
    const b = new Buf(this.w, this.h), oc = pack(hex(o.outline || '#120c18'));
    const R = ramps.map(packRamp);
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const i = y * this.w + x, m = this.m[i];
      if (m < 0) {
        if (o.outline !== null && (this.has(x - 1, y) || this.has(x + 1, y) || this.has(x, y - 1) || this.has(x, y + 1)) && !(o.openBelow != null && y >= o.openBelow)) b.set(x, y, oc);
        continue;
      }
      let l = this.l[i] + off;
      if (light !== 0) {
        if (!this.has(x + light, y)) l += rim * 0.9;
        if (!this.has(x - light, y)) l -= sh; else if (!this.has(x - 2 * light, y)) l -= sh * 0.45;
      }
      if (!this.has(x, y - 1)) l += rim * 0.55;
      if (!this.has(x, y + 1)) l -= 0.55;
      b.set(x, y, dpick(R[m], l, x, y));
    }
    for (const [x, y, c] of this.fx) b.set(x, y, pack(hex(c)));
    return b.flush();
  }
}

/* =====================================================================
   Palettes
   ===================================================================== */
const RP = {
  wall: ['#140f1d', '#1c1428', '#261a33', '#33223d', '#4a2f45', '#6a4049', '#8e5a4f', '#b67a5a', '#d8a06a'],
  wood: ['#1a1014', '#2a1a1a', '#3d2420', '#55322a', '#6e4433', '#8c5a3e', '#ad7449', '#cf9659', '#e8b878'],
  under: ['#07050b', '#0d0912', '#140f1b', '#1c1525'],
  curtain: ['#11171d', '#182228', '#203033', '#2b403f', '#3a564f', '#4f6f60', '#6a8c74', '#8aa88a'],
  brass: ['#2e2216', '#56401f', '#856028', '#b48a3a', '#dcb45a', '#f6dc8e'],
  shade: ['#5a2a1e', '#8a3e26', '#b85a30', '#e0823c', '#f5aa52', '#ffd27a'],
  paper: ['#5a4a46', '#8a7668', '#b9a48e', '#dfcaae', '#f4e4c6', '#fff4dc'],
  sunp: ['#7a3424', '#b0503a', '#de7a48', '#f4a35a', '#ffcf86'],
  mtnp: ['#1a2434', '#26384a', '#36505e', '#4c6a72', '#668a86'],
  maroon: ['#24101a', '#421b26', '#652a33', '#8a3c3e', '#ad5a4e', '#c87a62'],
  teal: ['#0d1f22', '#183335', '#224c4a', '#30665e', '#468476', '#62a08a'],
  mustard: ['#33240f', '#574016', '#805e22', '#a88232', '#cca44e', '#e6c470'],
  green: ['#0d1a12', '#16291b', '#213f27', '#2f5833', '#437342', '#5e9052', '#80ac68'],
  stem: ['#0e1a10', '#1a2c18', '#284220', '#3a5a2a'],
  terra: ['#341810', '#5a2a1a', '#843e26', '#a85432', '#c67044', '#e0905c'],
  cream: ['#3e302c', '#6e5a50', '#a08a78', '#c8b096', '#e6d0b0', '#f8e8cc'],
  coffee: ['#140a08', '#24140e', '#3a2216', '#563420'],
  graphite: ['#16121a', '#2a2430', '#423a48', '#605668', '#827888'],
  boom: ['#121419', '#1c2028', '#282e38', '#384250', '#4c5866', '#64727e', '#808c96'],
  grille: ['#08080b', '#101015', '#18181f', '#22222b', '#2e2e39'],
  glass: ['#060609', '#0c0c12', '#14141d', '#1e1e2a'],
  orange: ['#4a2214', '#86401f', '#c4662e', '#ec9448', '#ffc272'],
  devon: ['#2c2640', '#575170', '#8f88a2', '#c4bcc6', '#e8ddd4', '#fff6e8', '#ffffff'],
  pinkEar: ['#4a2e3a', '#7a4a58', '#a86a78', '#cc8e98', '#e6b2b4'],
  sphynx: ['#211a1d', '#3a2f33', '#56474b', '#736166', '#8f7b7e', '#a99494', '#c0aba5'],
  sphMask: ['#0e0a0c', '#191214', '#251b1e', '#33262a', '#43333a'],
  sphEar: ['#22181b', '#36282c', '#4c3a3e', '#64504f', '#7c6662']
};

const SKY_KEYS = [
  { sky: ['#2b2456', '#4a3170', '#7c3f7d', '#c2577c', '#ee8b6b', '#f9c57c'],
    far: ['#4a3a6e', '#6e4a80', '#9a5c86', '#c97f8f'], near: ['#2a2048', '#3a2a58', '#4d3666', '#64447a'],
    forest: ['#120d20', '#1b142e', '#2a1f3d'], snow: ['#f0bca8', '#ffe2c8'], cloud: ['#6a3f72', '#a4587c', '#de7f7a', '#f6b38a'] },
  { sky: ['#121736', '#1c2250', '#302e68', '#4f3c78', '#7e4f80', '#a8687c'],
    far: ['#2a2a55', '#3a3466', '#4c3e72', '#64507e'], near: ['#18183a', '#201f46', '#2a2650', '#36305c'],
    forest: ['#0a0a18', '#100e20', '#18152c'], snow: ['#8a86b0', '#aaa4c6'], cloud: ['#232750', '#363664', '#52467a', '#765a86'] },
  { sky: ['#060a1a', '#0a112b', '#0f193b', '#16224a', '#1e2c58', '#283866'],
    far: ['#141c3c', '#1a2448', '#222e56', '#2c3a64'], near: ['#0c1128', '#111833', '#161f3e', '#1d284a'],
    forest: ['#05070f', '#080b17', '#0c1020'], snow: ['#7d8bb5', '#a9b6d8'], cloud: ['#141b38', '#1d264c', '#29345e', '#384470'] }
];
function skyT() {
  if (ST.sky === 'sunset') return 0;
  if (ST.sky === 'dusk') return 0.5;
  if (ST.sky === 'night') return 1;
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  if (h >= 21 || h < 5) return 1;
  if (h >= 19 || h < 7) return 0.5;
  return 0;
}
function palette(t, rain) {
  const [A, B, u] = t <= 0.5 ? [SKY_KEYS[0], SKY_KEYS[1], t / 0.5] : [SKY_KEYS[1], SKY_KEYS[2], (t - 0.5) / 0.5];
  const P = {};
  for (const k of ['sky', 'far', 'near', 'forest', 'snow', 'cloud']) {
    P[k] = A[k].map((c, i) => mix(hex(c), hex(B[k][i]), u));
    if (rain) P[k] = P[k].map(c => {
      const l = 0.3 * c[0] + 0.55 * c[1] + 0.15 * c[2];
      return mix(c, [l * 0.86, l * 0.93, l * 1.1], 0.7).map(v => Math.round(clamp(v * 0.72, 0, 255)));
    });
  }
  const deep = P.sky[0].map(v => v * 0.6);
  P.dark = {};
  for (const k of ['sky', 'far', 'near', 'forest', 'snow']) P.dark[k] = packRamp(P[k].map(c => mix(c, deep, 0.38)));
  for (const k of ['sky', 'far', 'near', 'forest', 'snow', 'cloud']) P[k + 'P'] = packRamp(P[k]);
  return P;
}

/* =====================================================================
   Terrain
   ===================================================================== */
const forest = new Uint8Array(W * H), farTop = new Int16Array(W + 2), nearTop = new Int16Array(W + 2);
const farY = x => HZ - 12 - (22 * Math.pow(1 - Math.abs(Math.sin(0.024 * x + 0.4)), 1.4) + 9 * Math.pow(1 - Math.abs(Math.sin(0.061 * x + 1.3)), 1.2) + 1.2 * Math.sin(0.45 * x));
const nearY = x => HZ - 3 - (13 * Math.pow(1 - Math.abs(Math.sin(0.04 * x + 2.1)), 1.2) + 5 * (1 - Math.abs(Math.sin(0.11 * x + 0.3))) + 0.8 * Math.sin(0.7 * x));
const shoreY = x => 102 + Math.round(1.2 * Math.sin(x * 0.23) + 1.3 * Math.sin(x * 0.07 + 1));
// forest mask: 1 = shaded side, 2 = lit side
function mark(x, y, lit) { if (x >= 0 && x < W && y >= 0) forest[y * W + x] = Math.max(forest[y * W + x], lit ? 2 : 1); }
function fir(tx, by, h, r) {
  // tiered spruce: widens steadily, each tier steps back by one pixel, never narrower than the tier above
  const maxHw = Math.max(2, Math.round(h * 0.3));
  let prev = 0;
  for (let i = 0; i < h; i++) {
    const y = by - h + i;
    let hw = Math.min(maxHw, Math.floor(i * 0.42 + 0.2));

function beatEvent(e, late) {
  if (e.k === 'bar') { BEAT.barT = e.t; BEAT.barDur = e.dur; BEAT.bars++; cats.sph.groove = Math.random() < 0.3 + 0.5 * ST.beat; return; }
  if (e.k === 'stop') { BEAT.stop = e; return; }
  if (late || !ST.beat || !ST.layers[BEAT_LAYER[e.k]]) return;
  const D = cats.devon, S = cats.sph;
  if (e.k === 'kick') {
    BEAT.kick = Math.max(BEAT.kick, e.v);
    if (D.nod === 0 && Math.random() < (e.v > 0.7 ? 0.4 : 0.12) * ST.beat) D.nod = 1;
  } else if (e.k === 'snare') {
    BEAT.snare = Math.max(BEAT.snare, e.v);
    if (e.v < 0.5) return;
    // the Sphynx keeps the backbeat for a few bars at a time (head dips, tail tip lifts), and now and then an ear answers
    if (S.groove && !(S.doze > 0) && !(S.sleepy > 0)) S.tap = 1;
    if (S.ear === 0 && Math.random() < 0.35 * ST.beat) { S.ear = 0.15; S.earSide = Math.random() < 0.5 ? 'L' : 'R'; }
  } else if (e.k === 'hat') {
    if (bulbs.length && Math.random() < 0.5 * ST.beat) bulbs[Math.floor(Math.random() * bulbs.length)].s = 1;
  } else if (e.k === 'chord') {
    BEAT.chord = 1;
    if (waves.length < 4) waves.push({ a: 0 });
  }
}

function update(dt) {
  time += dt;
  if (AC) {
    // an event is due once its sound has reached the speakers
    const now = AC.currentTime - Math.min(0.2, AC.outputLatency || AC.baseLatency || 0);
    let n = 0;
    for (const e of vq) { if (e.t > now) vq[n++] = e; else beatEvent(e, now - e.t > 0.25); }
    vq.length = n;
    BEAT.pos = BEAT.barDur ? BEAT.bars + clamp((now - BEAT.barT) / BEAT.barDur, 0, 1) : 0;
    const st = BEAT.stop;
    BEAT.rate = !st || now < st.t ? 1 : now < st.t + st.len ? 1 - (now - st.t) / st.len : now < st.resume ? 0 : Math.min(1, (now - st.resume) / 0.4);
    if (st && now > st.resume + 0.4) BEAT.stop = null;
  }
  BEAT.kick *= Math.exp(-dt * 9); BEAT.snare *= Math.exp(-dt * 9); BEAT.chord *= Math.exp(-dt * 1.6);
  // the lamp follows kick and chord with a soft attack and a slower release, a swell and not a flash
  { const tgt = 0.5 * BEAT.kick + 0.5 * BEAT.chord; BEAT.glow += (tgt - BEAT.glow) * Math.min(1, dt * (tgt > BEAT.glow ? 30 : 5)); }
  for (const b of bulbs) b.s = Math.max(0, b.s - dt * 6);
  waves.forEach(w => w.a += dt * 1.1); waves = waves.filter(w => w.a < 1);
  const D = cats.devon, S = cats.sph;
  S.tap = Math.max(0, S.tap - dt * 4); S.ear = Math.max(0, S.ear - dt);
  // Devon's tail sways once per bar while the music plays, drifting into step instead of jumping
  { const locked = playing && ST.beat > 0 && BEAT.barDur > 0;
    swayPh += dt * (locked ? 2 * Math.PI / BEAT.barDur : 1.5);
    if (locked) { let err = (2 * Math.PI * BEAT.pos - swayPh) % (2 * Math.PI); if (err > Math.PI) err -= 2 * Math.PI; else if (err < -Math.PI) err += 2 * Math.PI; swayPh += err * Math.min(1, dt * 3); } }
  D.nod = Math.max(0, D.nod - dt * 3.5);
  // breathing: in for a third of the cycle, out for half, then a rest; slower while dozing
  for (const c of [D, S]) {
    c.bph = (c.bph + dt / (c.doze > 0 || c.sleepy > 0 ? c.bper * 1.3 : c.bper)) % 1;
    const t = c.bph < 0.35 ? c.bph / 0.35 : c.bph < 0.85 ? 1 - (c.bph - 0.35) / 0.5 : 0;
    c.br = t * t * (3 - 2 * t);
  }
  look(D, D.cx, D.by - 20.5, dt); look(S, S.cx - 7, S.by - 34.5, dt);
  for (const c of [D, S]) { if (time > c.nextBlink) { c.blink = 0.14; c.nextBlink = time + 2.5 + Math.random() * 5; } c.blink = Math.max(0, c.blink - dt); }
  if (time > S.nextSleepy) { S.sleepy = 4 + Math.random() * 6; S.nextSleepy = time + S.sleepy + 12 + Math.random() * 20; S.purrSleepy = Math.random() < 0.7; }
  S.sleepy = Math.max(0, S.sleepy - dt);
  D.doze = Math.max(0, D.doze - dt); S.doze = Math.max(0, S.doze - dt);
  D.mouth = Math.max(0, D.mouth - dt); S.mouth = Math.max(0, S.mouth - dt);
  // now and then one of the cats speaks up on its own
  if (playing && time > cats.nextTalk) { cats.nextTalk = time + 120 + Math.random() * 180; catSay(Math.random() < 0.5 ? 'devon' : 'sph', Math.random() < 0.55 ? 'meow' : 'mrr'); }
  if (D.doze > 0) purrStart('devon'); else purrStop('devon');
  if (S.doze > 0 || (S.sleepy > 0 && S.purrSleepy)) purrStart('sph'); else purrStop('sph');
  purrTick();
  if (time > S.nextTwitch) { S.twitch = 0.9; S.nextTwitch = time + 3 + Math.random() * 7; }
  S.twitch = Math.max(0, S.twitch - dt);
  // reels turn with the tempo (3.24 s is a bar at 74 bpm) and wind down with a tape stop
  if (playing) reelA += dt * 3.2 * BEAT.rate * (BEAT.barDur ? 3.24 / BEAT.barDur : 1) * (1 + 7 * ffwd);
  ffwd = Math.max(0, ffwd - dt * 1.6); flare = Math.max(0, flare - dt * 4);
  if (roomFade < 1) roomFade = Math.min(1, roomFade + dt / roomFadeT);
  if (AC && analyser) {
    const fb = update.fb || (update.fb = new Uint8Array(analyser.frequencyBinCount));
    analyser.getByteFrequencyData(fb);
    for (let i = 0; i < 6; i++) {
      let m = 0; for (let k = SPEC_EDGE[i]; k < SPEC_EDGE[i + 1]; k++) m = Math.max(m, fb[k]);
      // each band is read against its own recent peak (55 steps is about 15 dB), so any mix fills the meter
      specPk[i] = Math.max(m, specPk[i] - dt * 6, 90);
      const v = playing ? clamp(1 - (specPk[i] - m) / 55, 0, 1) : 0;
      BEAT.spec[i] += (v - BEAT.spec[i]) * (v > BEAT.spec[i] ? 0.6 : 0.14);
    }
  }
  for (const c of OUT.clouds) { c.x += c.v * dt; if (c.x > 240) c.x = 90 - c.w; }
  for (const d of rainDrops) { d.y += d.s * dt; d.x += d.s * dt * 0.22; if (d.y > 108) { d.y = 12 - Math.random() * 20; d.x = 84 + Math.random() * 150; } }
  for (const d of glassDrops) {
    d.t -= dt;
    if (d.t <= 0) { if (d.v) { d.v = 0; d.t = 1 + Math.random() * 6; } else { d.v = 8 + Math.random() * 22; d.t = 0.3 + Math.random() * 1.2; } }
    d.y += d.v * dt;
    if (d.y > 105) { d.y = 21 + Math.random() * 20; d.x = 99 + Math.floor(Math.random() * 131); }
  }
  if (ST.rain && Math.random() < dt * 9) ripples.push({ x: 100 + Math.random() * 128, y: HZ + 2 + Math.floor(Math.random() * 20), a: 0 });
  ripples.forEach(r => r.a += dt); ripples = ripples.filter(r => r.a < 0.6);
  for (const f of OUT.flies) {
    f.vx += (Math.random() - 0.5) * dt * 14; f.vy += (Math.random() - 0.5) * dt * 10;
    f.vx *= 0.97; f.vy *= 0.97; f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < 100 || f.x > 228) f.vx *= -1; if (f.y < 66 || f.y > 103) f.vy *= -1;
  }
  steamT -= dt;
  if (steamT <= 0) { steam.push({ x: 95.5 + Math.random() * 3, y: 135, a: 0, p: Math.random() * 6 }); steamT = 0.35; }
  steam.forEach(s => { s.a += dt; s.y -= dt * (s.v || 5); }); steam = steam.filter(s => s.a < 3.4);
  for (const m of motes) { m.y -= dt * (0.6 + Math.sin(time * 0.3 + m.p) * 0.6); m.x += Math.sin(time * 0.4 + m.p * 3) * dt * 1.5; if (m.y < 86) { m.y = 134; m.x = 22 + Math.random() * 60; } }
  if (!OUT.rain && OUT.t > 0.6) {
    nextShoot -= dt;
    if (nextShoot <= 0 && !shoot) { shoot = { x: 140 + Math.random() * 80, y: 22 + Math.random() * 16, a: 0 }; nextShoot = 25 + Math.random() * 50; }
  }
  if (shoot) { shoot.a += dt; shoot.x -= dt * 70; shoot.y += dt * 24; if (shoot.a > 0.55) shoot = null; }
}

function draw() {
  g.globalAlpha = 1; g.clearRect(0, 0, W, H);
  g.drawImage(skyBuf.cv, 0, 0);
  // stars
  const sv = OUT.rain ? 0 : clamp((OUT.t - 0.3) / 0.5, 0, 1);
  if (sv > 0) for (const s of stars) {
    if (OUT.moon && Math.hypot(s.x - OUT.moon.x, s.y - OUT.moon.y) < 9) continue;
    const a = sv * s.b * (0.6 + 0.4 * Math.sin(time * s.f + s.p));
    px(s.x, s.y, '#fff6e0', a);
    if (s.big) { px(s.x - 1, s.y, '#fff6e0', a * 0.35); px(s.x + 1, s.y, '#fff6e0', a * 0.35); px(s.x, s.y - 1, '#fff6e0', a * 0.35); px(s.x, s.y + 1, '#fff6e0', a * 0.35); }
  }
  if (shoot) for (let k = 0; k < 6; k++) px(shoot.x + k * 2, shoot.y - k * 0.7, '#fff6e0', (1 - k / 6) * (1 - shoot.a / 0.55));
  g.globalAlpha = 1;
  for (const c of OUT.clouds) g.drawImage(c.cv, Math.round(c.x), c.y);
  g.drawImage(landBuf.cv, 0, 0);
  // lake
  for (const gl of OUT.glints) { const v = Math.sin(time * gl.s + gl.p); if (v > 0.45) rectA(gl.x, gl.y, gl.len, 1, OUT.glintCol, (v - 0.45) * 1.4); }
  for (const r of ripples) {
    const w = r.a < 0.15 ? 0 : r.a < 0.35 ? 1 : 2;
    rectA(Math.round(r.x - w), r.y, w * 2 + 1, 1, '#aab8d8', 0.5 - r.a * 0.6);
  }
  for (const f of OUT.flies) {
    const b = Math.max(0, Math.sin(time * f.f + f.p)); if (b < 0.05) continue;
    rectA(Math.round(f.x) - 1, Math.round(f.y) - 1, 3, 3, '#d8f27a', b * b * 0.18);
    px(f.x, f.y, '#efffa0', b);
  }
  for (const d of rainDrops) for (let k = 0; k < 3; k++) px(d.x - k * 0.22, d.y - k, '#aebfdc', 0.32 - k * 0.09);
  for (const d of glassDrops) { px(d.x, d.y, '#dfe8f6', 0.6); px(d.x, d.y + 1, '#0b0f20', 0.35); if (d.v) px(d.x, d.y - 1, '#c8d4ea', 0.25); }
  g.globalAlpha = 1;
  if (roomFade < 1) { g.drawImage(roomPrev, 0, 0); g.globalAlpha = roomFade; }
  g.drawImage(roomCv, 0, 0); g.globalAlpha = 1;
  // the lamp swells a little with each kick and chord
  if (ST.lamp && BEAT.glow * ST.beat > 0.01) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.45 * BEAT.glow * ST.beat; g.drawImage(glowCv, 0, 0); g.globalCompositeOperation = 'source-over'; }

  // fairy lights: slow shimmer, a pulse that runs along the string on each chord, a sparkle on some hats
  for (const b of bulbs) {
    const v = 0.55 + 0.45 * Math.sin(time * 0.9 + b.p);
    let w = 0; for (const q of waves) w = Math.max(w, Math.exp(-(((b.x - 64 - q.a * 200) / 15) ** 2)));
    w *= ST.beat;
    rectA(b.x - 1, b.y - 1, 3, 3, b.c, 0.16 * v + 0.3 * w);
    px(b.x, b.y, b.c, Math.min(1, 0.55 + 0.45 * v + w));
    if (b.s > 0) { px(b.x, b.y, '#fff6e0', b.s); rectA(b.x - 1, b.y, 3, 1, '#fff6e0', 0.4 * b.s); rectA(b.x, b.y - 1, 1, 3, '#fff6e0', 0.4 * b.s); }
  }
  // dust motes in lamp light
  if (ST.lamp) for (const m of motes) px(m.x, m.y, '#ffe0a8', 0.25 + 0.25 * Math.sin(time * 1.3 + m.p));
  // candle flame, a little taller and brighter just after it is lit
  if (ST.candle) { const fl = Math.sin(time * 13) + Math.sin(time * 7.3 + 1), jx = fl > 1.2 ? 1 : fl < -1.2 ? -1 : 0;
    rectA(211, 111, 7, 8, '#ffb84a', 0.08 + 0.03 * Math.sin(time * 9) + 0.2 * flare);
    px(214, 118, '#f6a83a'); px(214, 117, '#fff1b0'); px(214, 116, '#ffe08a'); px(214 + jx, 115, '#f6a83a', 0.9);
    if (fl > 0 || flare > 0) px(214 + jx, 114, '#f6a83a', 0.5 + 0.5 * flare);
    if (flare > 0.4) px(214, 113, '#f6a83a', flare); }
  // mug steam, and smoke from a candle that was just blown out (same particles, their own colour)
  for (const s of steam) px(s.x + Math.sin(s.a * 2.2 + s.p) * 1.4, s.y, s.c || '#e8d8c8', (s.c ? 0.6 : 0.32) * Math.sin(Math.PI * s.a / 3.4));
  // boombox: speaker caps push out on the kick, reels, spectrum
  if (BEAT.kick > 0.45) for (const cx of [252, 286]) { ellA(cx, 124, 2.4, 2.4, '#2e2e39', 1); ellA(cx, 124, 1.4, 1.4, '#3c3c4a', 1); }
  for (const [cx, cy] of [[266, 119], [272, 119]]) {
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; px(cx + Math.round(Math.cos(a) * 2.6), cy + Math.round(Math.sin(a) * 2.6), '#4c505c'); }
    for (let k = 0; k < 3; k++) { const a = reelA + k * Math.PI * 2 / 3; px(cx + Math.round(Math.cos(a) * 1.6), cy + Math.round(Math.sin(a) * 1.6), '#c8c0b0'); }
    px(cx, cy, '#e8e0d0');
  }
  rectA(266, 122, 7, 1, '#3a2a20', 1);
  { const cols = ['#5fbf6a', '#cfd05a', '#f05a40'];
    for (let i = 0; i < 6; i++) { const n = Math.round(BEAT.spec[i] * 3); for (let r = 0; r < 3; r++) px(263 + i * 2, 132 - r, r < n ? cols[r] : '#1c2420', 1); } }

  // cats
  const D = cats.devon, S = cats.sph;
  ellA(D.cx, D.by - 0.5, 11, 1.4, '#0a0610', 0.45);
  ellA(S.cx + 2, S.by - 1, 15, 1.6, '#0a0610', 0.45);
  chain(D.cx + 7, D.by - 3, 0.3, 0.085, 16, 1.4, i => 0.05 * Math.sin(swayPh - i * 0.3) * (i / 8), 2, '#cfc6cc', '#120c18');
  g.globalAlpha = 1;
  g.drawImage(CAT.devonBody[D.br > 0.5 ? 1 : 0], D.cx - 14, D.by - 23);
  g.drawImage(CAT.sphBody[S.br > 0.5 ? 1 : 0], S.cx - 18, S.by - 31);
  chain(S.cx + 12, S.by - 6, 0.9, 0, 14, 1.5, i => i < 5 ? 0.45 : (i > 10 ? 0.4 * Math.sin(time * 9) * S.twitch : 0) + (i > 8 ? 0.22 * Math.sin(Math.PI * S.tap) : 0), 1, '#736166', '#120c18');
  g.globalAlpha = 1;

  // present
  sc.fillStyle = '#0d0912'; sc.fillRect(0, 0, screen.width, screen.height);
  sc.imageSmoothingEnabled = false;
  if (view.ext) {
    const e = view.ext, yTop = Math.round(view.oy), yBot = Math.round(view.oy + H * view.s);
    sc.drawImage(e.top, 0, 0, W, e.T, view.ox, 0, W * view.s, yTop);
    sc.drawImage(e.bot, 0, 0, W, e.B, view.ox, yBot, W * view.s, Math.round(e.B * view.s));
    sc.drawImage(low, 0, 0, W, H, view.ox, yTop, W * view.s, yBot - yTop);
  } else sc.drawImage(low, 0, 0, W, H, view.ox, view.oy, W * view.s, H * view.s);
  // heads are drawn at screen resolution so a nod or a breath can move them by part of a pixel
  const head = (spr, x, y) => sc.drawImage(spr, Math.round(view.ox + x * view.s), Math.round(view.oy + y * view.s), Math.round(spr.width * view.s), Math.round(spr.height * view.s));
  const nodOff = D.nod > 0 ? 0.5 * Math.sin(Math.PI * (1 - D.nod)) : 0, dShut = D.mouth <= 0 && (D.blink > 0 || D.doze > 0);
  head(dShut ? catHead('devon', 'closed', false, '', 0, 0) : catHead('devon', 'open', D.mouth > 0, '', D.lx, D.ly), D.cx - 14, D.by - 35 + nodOff - BREATH * D.br);
  const sEyes = S.mouth > 0 ? 'open' : S.blink > 0 || S.doze > 0 || (S.sleepy > 0 && S.sleepy < 1.2) ? 'closed' : S.sleepy > 0 ? 'half' : 'open';
  head(catHead('sph', sEyes, S.mouth > 0, S.ear > 0 ? S.earSide : '', sEyes === 'closed' ? 0 : S.lx, sEyes === 'open' ? S.ly : 0), S.cx - 21, S.by - 50 + (S.tap > 0.5 ? 1 : 0) - BREATH * S.br);
}

let lastT = performance.now(), lastSkyCheck = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  update(dt); draw();
  if (now - lastSkyCheck > 60000) { lastSkyCheck = now; if (ST.sky === 'auto' && skyT() !== OUT.t) buildOutside(); }
  requestAnimationFrame(frame);
}

/* =====================================================================
   BOOT
   ===================================================================== */
CAT.devonBody = [devonBody(false), devonBody(true)]; CAT.sphBody = [sphynxBody(false), sphynxBody(true)];
roomCv = buildRoom(); glowCv = buildGlow();
buildOutside(); spawnRain();
resize(); syncUI(); poke();
lastSkyCheck = performance.now();
requestAnimationFrame(frame);
</script>
</body>
</html>
